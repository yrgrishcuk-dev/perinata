server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never

spring:
  application:
    name: antenatal
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/antenatal}
    username: ${DATABASE_USER:antenatal}
    password: ${DATABASE_PASSWORD:antenatal}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  clinic-timezone: ${CLINIC_TIMEZONE:Europe/Moscow}
  link-token-ttl-minutes: ${LINK_TOKEN_TTL_MINUTES:15}
  dev-mode: ${DEV_MODE:false}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    init-data-max-age-seconds: ${TELEGRAM_INIT_DATA_MAX_AGE:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    ru.antenatal: INFO
