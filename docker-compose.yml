services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antenatal}
      POSTGRES_USER: ${POSTGRES_USER:-antenatal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antenatal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antenatal} -d ${POSTGRES_DB:-antenatal}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-antenatal}
      DATABASE_USER: ${POSTGRES_USER:-antenatal}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-antenatal}
      PUBLIC_BASE_URL: https://${DOMAIN}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Europe/Moscow}
      DEV_MODE: ${DEV_MODE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api2.max.ru}
      LINK_TOKEN_TTL_MINUTES: ${LINK_TOKEN_TTL_MINUTES:-15}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-antenatal}
      PGUSER: ${POSTGRES_USER:-antenatal}
      PGPASSWORD: ${POSTGRES_PASSWORD:-antenatal}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
    volumes:
      - ./backup:/backup

volumes:
  pgdata:
  caddy_data:
  caddy_config:
